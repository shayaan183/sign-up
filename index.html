<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Portal</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <img src="images/odin-lined.png" alt="Odin Logo" class="logo-img">
                <span class="logo-text">ODIN</span>
            </div>
            <footer class="credit">
                Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </footer>
        </aside>

        <main class="content">
            <div class="content-body">
                <section class="intro">
                    <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                    <p>You <em>know</em> you want to.</p>
                </section>

                <section class="form-container">
                    <p>Let's do this!</p>

                    <form action="#" method="post" id="signup-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="first-name">First Name</label>
                                <input type="text" name="first_name" id="first-name" placeholder="Thor">
                            </div>

                            <div class="input-group">
                                <label for="last-name">Last Name</label>
                                <input type="text" name="last_name" id="last-name" placeholder="Odinson">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="email">Email</label>
                                <input type="email" name="email" id="email" placeholder="thor.odinson@asgard.com">
                            </div>
                            <div class="input-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" name="phone" id="phone">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" id="password" required minlength="8">
                            </div>
                            <div class="input-group">
                                <label for="confirm">Confirm Password</label>
                                <input type="password" name="confirm" id="confirm" required minlength="8">
                            </div>
                        </div>
                    </form>
                </section>

                <section class="form-actions">
                    <button type="submit" form="signup-form">Create Account</button>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </section>
            </div>

            <footer class="main-footer">
                <p>Created by 
                    <a class="footer-link" href="https://github.com/shayaan183" target="_blank" rel="noopener noreferrer">Shayaan Musthafa 
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"></path>
                        </svg>
                    </a>
                </p>
            </footer>
        </main>
    </div>
</body>
</html>
